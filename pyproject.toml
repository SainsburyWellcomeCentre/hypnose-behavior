[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "hypnose-behavior"
version = "2.0.0"
description = "Analysis tools for hypnose experiments"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy<2",
    "pandas",
    "pyarrow",
    "matplotlib",
    "scipy",
    "tqdm",
    "dotmap",
    "Pillow",
    "ipython",
    "ipywidgets",
    "ipykernel",
    "ipympl",
    "pyyaml",

    # Behavioural-data and video stack.
    "swc-aeon==0.1.0",
    "harp-python",
    "moviepy",
    "opencv-python",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
# device_schemas carries an __init__.py, so it is a package in its own right and its data
# is keyed by that package name. The top-level `hypnose_behavior` key is kept as a
# belt-and-braces fallback for older setuptools resolution.
"hypnose_behavior.resources.device_schemas" = ["*.yml"]
# qc/regression.py resolves both of these package-relative (regression.py:56 and :84), so
# an install that does not ship them has the gate but not its baselines.
"hypnose_behavior.qc" = ["fixtures/*.json", "sessions.yml"]
hypnose_behavior = [
    "resources/device_schemas/*.yml",
]