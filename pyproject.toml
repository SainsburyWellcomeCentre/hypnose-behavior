[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "hypnose-behavior"
version = "2.0.0"
description = "Analysis tools for hypnose experiments"
readme = "README.md"
requires-python = ">=3.9,<3.13"
# Base install: everything needed for the shared helpers (io.paths, io.save and the
# figure styles) plus the general analysis code. Every one of these supports Python
# 3.9, so repos pinned there — hypnose-eeg-preprocessing, via pomegranate/somnotate —
# can install this package and reuse those helpers.
dependencies = [
    "numpy<2",
    "pandas",
    "pyarrow",
    "matplotlib",
    "scipy",
    "tqdm",
    "dotmap",
    "Pillow",
    "ipython",
    "ipywidgets",
    "ipykernel",
    "ipympl",
    "pyyaml",
]

# Behavioural-data and video stack. 

#   pip install -e ".[behavioral]"   full install (what environment.yml does)
#   pip install -e .                 base only — helpers, no behavioural loaders

[project.optional-dependencies]
behavioral = [
    "swc-aeon==0.1.0",
    "harp-python",
    "moviepy",
    "opencv-python",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
# device_schemas carries an __init__.py (importlib.resources.files() cannot resolve a
# namespace package on Python 3.9), so it is a package in its own right and its data
# is keyed by that package name. The top-level `hypnose_behavior` key is kept as a
# belt-and-braces fallback for older setuptools resolution.
"hypnose_behavior.resources.device_schemas" = ["*.yml"]
hypnose_behavior = [
    "resources/device_schemas/*.yml",
]