  # "singrew" while its schema rewards every sequence -- the guard that
  # sing_rew_metrics.is_singrew_session() prefers the manifest flag over the name.
  - subjid: "053"
    date: "20260520"
    label: standard_doubles_all_rewarded
  - subjid: "048"
